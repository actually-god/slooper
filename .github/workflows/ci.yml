# W10 (docs/WINDOWS-PORT.md): CI matrix = the compile-guard for the Windows
# port + Linux regression gate.
#
#   linux           Linux truth: shipping release build, full headless lib
#                   suite (SLOOPER_NULL_AUDIO — e2e.rs needs a live JACK
#                   server and is NOT run here), clippy-zero.
#   windows-cross   The gnullvm cross-check that gated every W-task locally
#                   (llvm-mingw UCRT 20261104, same build as the dev host).
#                   Catches Linux-side regressions that break Windows.
#   windows-native  Real test execution on Windows: the #[cfg(windows)] pin
#                   set (W2/W3/W6/W7/W8) that cross-checks can never run,
#                   plus a report-only full-suite triage pass to grow the
#                   green list from.
#
# Test builds use the `citest` profile (Cargo.toml): release codegen without
# fat LTO — `cargo test --release` would compile tests through LTO because
# profile.bench inherits from release.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux (lib suite + clippy)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      SLOOPER_NULL_AUDIO: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: swatinem/rust-cache@v2
      - name: System deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libjack-jackd2-dev libx11-dev libxcursor-dev \
            libxkbcommon-dev libwayland-dev libgl1-mesa-dev libegl1-mesa-dev
      - name: Build (shipping profile)
        run: cargo build --release --locked
      # RESOLVED 2026-11-13 (session 28): the "script-FX heap corruption"
      # (glibc "corrupted size vs. prev_size") was a FIELD-DROP-ORDER UAF —
      # FxEditor dropped its Arc<Instance> BEFORE the custom-GUI guard
      # whose Drop calls the script's gui_destroy (which legitimately
      # touches the instance state). valgrind caught the write-after-free
      # deterministically (ubuntu-24.04 container); fix = declaration
      # order + fxgui::drop_order_tests pin. The pair now runs IN the
      # monolith (10/10 green on the floor distro where it aborted 3/10);
      # the isolated steps stay as defense-in-depth, now fully BLOCKING.
      - name: Lib suite (headless, citest profile)
        run: cargo test --profile citest --lib --locked
      - name: Script-editor pair in isolated processes
        run: |
          cargo test --profile citest --lib --locked -- --exact ui::tests::v36_script_fx_editor_docks
          cargo test --profile citest --lib --locked -- --exact ui::tests::v36_script_fx_editor_resizes
      - name: Script-FX pair in isolated processes
        run: |
          cargo test --profile citest --lib --locked -- --exact ui::tests::v20_fx_auto_slider_rmb_auto
          cargo test --profile citest --lib --locked -- --exact ui::tests::v20_fx_bridge_slider_rmb_auto
          cargo test --profile citest --lib --locked -- --exact ui::tests::v20_fx_pair_teardown_survives_heap_churn
      - name: Clippy zero
        run: |
          set -o pipefail
          cargo clippy --all-targets --locked 2>&1 | tee clippy.log
          ! grep -qE '^warning: |^error' clippy.log

  windows-cross:
    name: Cross-check (x86_64-pc-windows-gnullvm)
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: swatinem/rust-cache@v2
        with:
          key: gnullvm
      - name: Install llvm-mingw (pinned 20261104 UCRT build)
        run: |
          cd "$RUNNER_TEMP"
          curl -fLo mm.tar.xz https://github.com/mstorsjo/llvm-mingw/releases/download/20261104/llvm-mingw-20261104-ucrt-ubuntu-22.04-x86_64.tar.xz
          tar xf mm.tar.xz
          # env var overrides the dev-host linker path in .cargo/config.toml
          echo "CARGO_TARGET_X86_64_PC_WINDOWS_GNULLVM_LINKER=$RUNNER_TEMP/llvm-mingw-20261104-ucrt-ubuntu-22.04-x86_64/bin/x86_64-w64-mingw32-gcc" >> "$GITHUB_ENV"
      - name: Add rustup target
        run: rustup target add x86_64-pc-windows-gnullvm
      - name: cargo check --all-targets
        run: cargo check --target x86_64-pc-windows-gnullvm --all-targets --locked

  windows-native:
    name: Windows (MSVC build + port pins)
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      SLOOPER_NULL_AUDIO: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: swatinem/rust-cache@v2
        with:
          key: win-msvc
      # The exe build is what the W7 probe pins re-exec (build.rs bakes
      # target/citest/slooper.exe as SLOOPER_EXE_PATH). Stage a copy FIRST:
      # `cargo test` rebuilds the bin as a libtest harness at the same path,
      # and re-executing THAT with --slooper-probe dies on libtest's own
      # option parser ("Unrecognized option"). SLOOPER_PROBE_EXE has top
      # resolution priority, so the pins ride the staged app exe.
      - name: Build exe (probe helper for W7/W6 pins)
        run: cargo build --profile citest --locked
      - name: Stage probe helper exe
        run: Copy-Item target/citest/slooper.exe target/citest/slooper-probe.exe
      - name: Compile lib tests
        run: cargo test --profile citest --lib --no-run --locked
      - name: Port pins w2..w8 (incl. the #[cfg(windows)] set)
        env:
          SLOOPER_PROBE_EXE: ${{ github.workspace }}\target\citest\slooper-probe.exe
        # NOTE: the filter is SUBSTRING-matched — `w8_` does NOT match the
        # `w8b_*` W8b embed pins (nor `w8c_*`), so each new sub-letter
        # series goes here. (`w9_` = W9 Windows MIDI; `w12` intentionally
        # covers the whole W12 polish family: w12a_, w12b_, …)
        run: cargo test --profile citest --lib --locked -- w2_ w3_ w4_ w5_ w6_ w7_ w8_ w8b_ w8c_ w9_ w11_ w12 w14_
      - name: Release build proof (shipping profile = winrel, W12e)
        # `winrel` IS what ships (release.yml builds the zip with it):
        # release minus strip, plus minimal debuginfo, so the minidumps
        # src/crash.rs writes resolve to module+function names. Prove the
        # real profile builds, not a look-alike.
        run: cargo build --profile winrel --locked
      - name: Full lib suite (BLOCKING since W14 — 589/0 on f658ac5, 13-Nov)
        env:
          SLOOPER_PROBE_EXE: ${{ github.workspace }}\target\citest\slooper-probe.exe
        run: cargo test --profile citest --lib --locked --no-fail-fast
