# W11 (docs/WINDOWS-PORT.md): GitHub Release assets, built by CI.
#
#   On tag push v*:  publish a release with the two shipping assets —
#     slooper-<ver>-linux-x86_64.tar.zst   (usr/ prefix: extract into /,
#                                           mirrors the AUR pkg layout;
#                                           the AUR source flow is
#                                           UNTOUCHED by this workflow)
#     slooper-win64.zip                    (MSVC release exe + README +
#                                           LICENSE — exe carries the
#                                           embedded icon via winresource)
#   workflow_dispatch: the same pipeline against the CURRENT commit, but
#   as a DRAFT release — validates the packaging path end to end without
#   publishing anything.
#
# Windows ships from CI's MSVC host on purpose: the windows-native CI job
# already proved the MSVC target green (W10), rc.exe is present there for
# the icon resource, and users get a same-OS build. The gnullvm cross
# target stays the compile-guard (windows-cross job); it cannot embed the
# icon (no supported resource compiler) and is not a shipping vehicle.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    # W13a (docs/WINDOWS-PORT.md): this asset MUST be built on the FLOOR
    # distro — the oldest supported glibc — because a binary carries the
    # glibc version symbols of its BUILD machine. ubuntu-22.04 = glibc 2.35
    # = Ubuntu 22.04 / Debian 12 / Fedora 38 tier. Never bump this runner
    # back up without re-deciding the floor. The floor symbols of the
    # SHIPPED exe are asserted below, so a silent drift fails the pipeline.
    name: Linux asset (tar.zst, floor distro)
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      # W13a portability floors: max versioned symbols the exe may require.
      # Floors = what the OLDEST supported distro's runtime provides:
      #   glibc 2.35        (Ubuntu 22.04 base; Debian 12 = 2.36)
      #   GLIBCXX 3.4.30    (libstdc++ GCC 12 = Ubuntu 22.04 / Debian 12)
      #   CXXABI  1.9.15    (same GCC 12 runtime)
      GLIBC_FLOOR: "2.35"
      GLIBCXX_FLOOR: "3.4.30"
      CXXABI_FLOOR: "1.9.15"
    steps:
      - uses: actions/checkout@v4
      - uses: swatinem/rust-cache@v2
        with:
          key: release-linux-floor
      - name: Toolchain (runner image may lag stable)
        run: rustup update stable && rustup default stable
      - name: System deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libjack-jackd2-dev libx11-dev libxcursor-dev \
            libxkbcommon-dev libwayland-dev libgl1-mesa-dev libegl1-mesa-dev zstd
      - name: Build (shipping profile)
        run: cargo build --release --locked
      # W13a: assert the SHIPPED exe's versioned-symbol demand against the
      # floor (never trust "it built on 22.04" — measure the artifact).
      # GLIBC_* comes from the floor distro's libc; GLIBCXX_*/CXXABI_* from
      # its libstdc++ (the ffiguard C++ shim links it dynamically).
      - name: Portability floor assert
        run: |
          set -euo pipefail
          B=target/release/slooper
          fail=0
          for fam in GLIBC GLIBCXX CXXABI; do
            floor_var="${fam}_FLOOR"
            want="${!floor_var}"
            got="$(objdump -T "$B" | grep -oE "${fam}_[0-9.]+" | sed "s/^${fam}_//" | sort -uV | tail -1)"
            if [ -z "$got" ]; then
              echo "::error::no ${fam}_* symbols found — did objdump run at all?"
              fail=1; continue
            fi
            newest="$(printf '%s\n%s\n' "$got" "$want" | sort -V | tail -1)"
            if [ "$newest" != "$want" ]; then
              echo "::error::exe requires ${fam} $got but the support floor is $want — the asset would not load on the oldest supported distro"
              fail=1
            else
              echo "OK: max ${fam} requirement $got <= floor $want"
            fi
          done
          objdump -p "$B" | grep NEEDED
          exit $fail
      - name: Stage + pack
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          [ "$VERSION" = "$GITHUB_REF_NAME" ] && VERSION="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)-dev.${GITHUB_SHA::7}"
          P="slooper-$VERSION-linux-x86_64"
          mkdir -p "$P/usr/bin" "$P/usr/share/applications" "$P/usr/share/pixmaps"
          cp target/release/slooper "$P/usr/bin/slooper"
          cp slooper.desktop "$P/usr/share/applications/slooper.desktop"
          cp assets/icon.png "$P/usr/share/pixmaps/slooper.png"
          cp README.md LICENSE docs/INSTALL.md "$P/"
          tar --zstd -cf "slooper-$VERSION-linux-x86_64.tar.zst" "$P"
      # W13b: distro smoke matrix on the STAGED exe (exact shipped bytes,
      # per the pdb-era lesson "verify the artifact, not the build").
      # scripts/porting/w13b_matrix.sh runs it through
      # `--slooper-probe 2 /nonexistent` in arch / debian:12 / ubuntu:22.04
      # / fedora:40 containers that installed ONLY runtime libs — a real
      # loads-and-runs proof per distro. The floor-build sabotage pair for
      # this is the same script against any newer-glibc build (see DONE log).
      - name: Distro smoke matrix (W13b)
        run: bash scripts/porting/w13b_matrix.sh slooper-*/usr/bin/slooper
      - uses: actions/upload-artifact@v4
        with:
          name: linux-asset
          path: slooper-*-linux-x86_64.tar.zst

  windows:
    name: Windows asset (slooper-win64.zip)
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: swatinem/rust-cache@v2
        with:
          key: release-win-msvc
      - name: Build (shipping profile, MSVC)
        # W12e: winrel = release WITH symbols so crash minidumps
        # (src/crash.rs) resolve to function names.
        run: cargo build --profile winrel --locked
      - name: Stage + zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory stage | Out-Null
          Copy-Item target/winrel/slooper.exe stage/slooper.exe
          Copy-Item README.md stage/README.md
          Copy-Item LICENSE stage/LICENSE
          Compress-Archive -Path stage/* -DestinationPath slooper-win64.zip -Force
      # W12e follow-up (PE walk of the first winrel artifact): the MSVC exe
      # carries a CODEVIEW/RSDS record naming `slooper.pdb` but NO debug
      # sections of its own — link.exe moves them into the PDB. So the
      # symbols a minidump needs live in that file, and a dump from a user
      # is only symbolizable if we keep the PDB of the exact build. Shipped
      # as a SEPARATE asset so the user-facing zip stays small; the GUID+age
      # in the exe's RSDS record is the match test. Fails loudly if the
      # profile ever stops emitting it.
      - name: Zip the debug symbols (separate asset)
        shell: pwsh
        run: |
          if (-not (Test-Path target/winrel/slooper.pdb)) {
            Write-Error "winrel produced no slooper.pdb — minidumps would be symbol-less"
            exit 1
          }
          Compress-Archive -Path target/winrel/slooper.pdb `
            -DestinationPath slooper-win64-pdb.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: windows-asset
          path: slooper-win64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows-pdb
          path: slooper-win64-pdb.zip

  release:
    name: Publish GitHub Release
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux-asset
      - uses: actions/download-artifact@v4
        with:
          name: windows-asset
      - uses: actions/download-artifact@v4
        with:
          name: windows-pdb
      - name: Release (tag → published, dispatch → draft)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: ${{ github.event_name == 'workflow_dispatch' }}
          generate_release_notes: ${{ github.event_name == 'push' }}
          files: |
            slooper-*-linux-x86_64.tar.zst
            slooper-win64.zip
            slooper-win64-pdb.zip
